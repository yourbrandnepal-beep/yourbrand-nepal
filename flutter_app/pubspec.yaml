name: rrchat_1
description: RRchat 1 — Ultra-secure, username-based end-to-end encrypted messaging client for Android, iOS, and Windows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Matrix-compatible client SDK with Olm/Megolm E2EE & cross-signing
  matrix: ^0.33.0
  # Hardware-backed key storage: Android Keystore, iOS Keychain, Windows DPAPI
  flutter_secure_storage: ^9.2.2
  # Audited cryptographic primitives (Argon2id, X25519, AES-GCM, HKDF)
  cryptography: ^2.7.0
  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  # Biometric gate & local authentication
  local_auth: ^2.3.0
  # Encrypted local database (SQLCipher / sqflite)
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
