#!/usr/sbin/nft -f
# RRchat 1 nftables ruleset — Default-deny inbound with rate-limited SSH and HTTPS only

flush ruleset

table inet rrchat_filter {
  chain input {
    type filter hook input priority filter; policy drop;

    # Allow established/related traffic and loopback
    ct state established,related accept
    iif "lo" accept
    ct state invalid drop

    # Rate-limit ICMPv4/v6 ping
    ip protocol icmp icmp type echo-request limit rate 5/second accept
    ip6 nexthdr ipv6-icmp icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request } limit rate 10/second accept

    # SSH brute-force protection (replace saddr with admin bastion IP in production)
    tcp dport 22 ct state new limit rate 4/minute accept

    # Allow only public HTTP (redirect) and HTTPS
    tcp dport { 80, 443 } ct state new accept
    udp dport 443 ct state new accept

    # Everything else (including 5432 Postgres, 8008 Synapse) is dropped
    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
