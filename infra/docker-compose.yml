version: "3.9"

networks:
  edge_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true # Blocks all outbound/public internet access for PostgreSQL and Synapse internals

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - internal_net
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    secrets:
      - pg_password
    # Do NOT map ports to host (5432 remains strictly on internal_net)

  synapse:
    image: matrixdotorg/synapse:v1.116.0
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - internal_net
      - edge_net
    volumes:
      - ./synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/log.config:/data/log.config:ro
      - ./data/synapse_media:/data/media_store
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    # Do NOT expose 8008 or 9000 publicly; traffic must pass through Caddy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - synapse
    networks:
      - edge_net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
